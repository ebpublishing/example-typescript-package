name: Release & Publish

on:
  push:
    branches:
      - main
      - development

jobs:
  release:
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN with explicit permissions replaces the
    # GH_TOKEN repo secret, whose expiry silently broke publishing
    # ("Bad credentials", 2026-09-26). Nothing here touches other repos,
    # so no PAT is needed.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag per version: the previous hardcoded tag could only ever be
          # created once, so the next publish would have failed on
          # "already_exists" even with valid credentials.
          tag_name: "v${{ steps.pkg.outputs.version }}"
          release_name: "v${{ steps.pkg.outputs.version }}"
          draft: false
          prerelease: false

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup .npmrc file to publish to npm
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install modules
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup .npmrc file to publish to GitHub Packages
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ebpublishing'
      - run: npm run addscope
      - name: Publish to GitHub Packages
        run: |
          npm install --save-dev @types/ws
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
